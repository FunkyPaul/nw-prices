services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - nwp_data:/data
    # Nur lokal erreichbar; nach aussen geht es ueber Caddy (HTTPS)
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  nwp_data:
  caddy_data:
  caddy_config:
